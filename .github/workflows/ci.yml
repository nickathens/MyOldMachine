name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-syntax:
    name: Python lint and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -q ruff
      - name: Lint with ruff
        run: ruff check bot.py core/ utils/ install/ tests/
      - name: Check Python syntax (all .py files)
        run: python -m py_compile bot.py && find core/ install/ utils/ -name '*.py' -exec python -m py_compile {} +
      - name: Run unit tests (offline, mocks all network)
        run: python -m unittest discover -s tests -v
      - name: Check for obvious import errors
        run: |
          pip install -q python-telegram-bot python-dotenv httpx apscheduler sqlalchemy
          python -c "
          import importlib, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              if 'skills/' in str(f) or '.venv/' in str(f):
                  continue
              try:
                  with open(f, encoding='utf-8') as fh:
                      compile(fh.read(), str(f), 'exec')
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'All core Python files compile cleanly')
          "

  install-script-lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint install.sh
        run: shellcheck -S warning -e SC2034,SC2086,SC2155,SC1091 install.sh

  install-dry-run:
    name: Install dry run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
      - name: Run wizard --help (verify it loads)
        run: |
          . .venv/bin/activate
          python install/wizard.py --help
      - name: Run provisioner --dry-run
        run: |
          . .venv/bin/activate
          python install/provisioner.py --repo-dir . --takeover minimal --dry-run
      - name: Verify bot imports
        run: |
          . .venv/bin/activate
          python -c "
          from core.config import get_llm_provider, get_llm_model
          from core.tools import get_tools_openai, get_tools_gemini, TOOL_DEFINITIONS
          from core.llm import create_provider
          from core.session import SessionManager
          from core.health import get_disk_usage, get_memory_usage
          print('All core imports successful')
          print(f'Tools: {len(TOOL_DEFINITIONS)}')
          print(f'OpenAI tool format: {len(get_tools_openai())} tools')
          print(f'Gemini tool format: {len(get_tools_gemini()[0][\"functionDeclarations\"])} declarations')
          "

  tool-schema-validation:
    name: Validate tool schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
      - name: Validate tool definitions
        run: |
          . .venv/bin/activate
          python -c "
          import json
          from core.tools import TOOL_DEFINITIONS, get_tools_openai, get_tools_gemini

          # Verify all tools have required fields
          for tool in TOOL_DEFINITIONS:
              assert 'name' in tool, f'Tool missing name: {tool}'
              assert 'description' in tool, f'Tool {tool[\"name\"]} missing description'
              assert 'parameters' in tool, f'Tool {tool[\"name\"]} missing parameters'
              params = tool['parameters']
              assert params.get('type') == 'object', f'Tool {tool[\"name\"]} params must be object type'
              assert 'properties' in params, f'Tool {tool[\"name\"]} missing properties'

          # Verify OpenAI format
          openai_tools = get_tools_openai()
          for t in openai_tools:
              assert t['type'] == 'function'
              assert 'function' in t
              assert 'name' in t['function']
              assert 'parameters' in t['function']

          # Verify Gemini format
          gemini_tools = get_tools_gemini()
          assert len(gemini_tools) == 1
          decls = gemini_tools[0]['functionDeclarations']
          for d in decls:
              assert 'name' in d
              assert 'parameters' in d
              # Verify no unsupported keywords leaked as dict keys in Gemini schema
              def check_keys(obj, path=''):
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          assert k not in ('additionalProperties', 'default', 'minimum', 'maximum'), \
                              f'Unsupported key \"{k}\" at {path}.{k} in Gemini schema for {d[\"name\"]}'
                          check_keys(v, f'{path}.{k}')
                  elif isinstance(obj, list):
                      for i, item in enumerate(obj):
                          check_keys(item, f'{path}[{i}]')
              check_keys(d['parameters'])

          print(f'All {len(TOOL_DEFINITIONS)} tool definitions valid')
          print(f'OpenAI format: {len(openai_tools)} tools')
          print(f'Gemini format: {len(decls)} declarations')
          "

  macos-checks:
    name: macOS smoke tests
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
      - name: Verify OS detection identifies macOS correctly
        run: |
          . .venv/bin/activate
          python -c "
          from install.os_detect import detect
          info = detect()
          assert info.os_type == 'macos', f'Expected macos, got {info.os_type}'
          assert info.version_major >= 14, f'Expected macOS 14+ runner, got {info.version}'
          print(f'OS:           {info.display_name}')
          print(f'Apple Silicon: {info.is_apple_silicon}')
          print(f'Has Homebrew:  {info.has_homebrew_support}')
          assert not info.blockers, f'Unexpected blockers on stock macOS-14 runner: {info.blockers}'
          "
      - name: Validate launch-agent plist
        run: |
          . .venv/bin/activate
          python -c "
          import subprocess, tempfile
          from pathlib import Path

          repo_dir = Path('.').absolute()
          template = repo_dir / 'install' / 'templates' / 'com.myoldmachine.bot.plist'
          assert template.exists(), f'Template not found: {template}'

          content = template.read_text(encoding='utf-8')
          subs = {
              '{{PYTHON}}': str(repo_dir / '.venv' / 'bin' / 'python'),
              '{{WORKING_DIR}}': str(repo_dir),
              '{{BOT_PY}}': str(repo_dir / 'bot.py'),
              '{{LOG_DIR}}': str(repo_dir / 'data' / 'logs'),
              '{{ENV_FILE}}': str(repo_dir / '.env'),
              '{{VENV_BIN}}': str(repo_dir / '.venv' / 'bin'),
              '{{HOME}}': str(Path.home()),
              '{{CLI_BIN_PATHS}}': '',
          }
          for k, v in subs.items():
              content = content.replace(k, v)
          assert '{{' not in content, f'unsubstituted placeholder:\n{content}'

          with tempfile.NamedTemporaryFile(suffix='.plist', mode='w', delete=False) as f:
              f.write(content)
              tmp = f.name

          result = subprocess.run(['plutil', '-lint', tmp], capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit(f'plutil -lint failed:\nstdout={result.stdout}\nstderr={result.stderr}')
          print('agent plist passes plutil -lint')
          "
      - name: Wizard --help loads on macOS
        run: |
          . .venv/bin/activate
          python install/wizard.py --help
      - name: Provisioner --dry-run on macOS path
        run: |
          . .venv/bin/activate
          python install/provisioner.py --repo-dir . --takeover minimal --dry-run
      - name: Verify bot imports on macOS
        run: |
          . .venv/bin/activate
          python -c "
          from core.config import get_llm_provider, get_llm_model
          from core.tools import TOOL_DEFINITIONS
          from core.llm import create_provider
          from core.session import SessionManager
          from core.health import get_disk_usage, get_memory_usage
          print(f'core imports ok, {len(TOOL_DEFINITIONS)} tools')
          "

  provider-factory:
    name: Validate provider factory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
      - name: Test provider creation
        run: |
          . .venv/bin/activate
          python -c "
          from core.llm import create_provider

          # Test all API providers can be instantiated
          providers = [
              ('claude-api', 'claude-sonnet-4-6', 'test-key'),
              ('openai', 'gpt-5.5', 'test-key'),
              ('openrouter', 'nvidia/nemotron-3-super-120b-a12b:free', 'test-key'),
              ('gemini', 'gemini-3-flash-preview', 'test-key'),
              ('deepseek', 'deepseek-v4-flash', 'test-key'),
              ('grok', 'grok-4-1-fast-non-reasoning', 'test-key'),
              ('kimi', 'kimi-k2.6', 'test-key'),
              ('minimax', 'MiniMax-M2.7', 'test-key'),
              ('ollama', 'llama3.1:8b', ''),
              ('codex', 'gpt-5.5', ''),
              ('codex-cli', 'gpt-5.5', ''),
          ]

          for name, model, key in providers:
              p = create_provider(name, model, key)
              # provider_name normalizes a few aliases
              expected = name
              if name == 'codex':
                  expected = 'codex-cli'
              assert p.provider_name == expected or name in ('claude-api', 'xai'), f'{name} provider_name mismatch (got {p.provider_name})'
              print(f'  {name}: {p.__class__.__name__} (vision={p.supports_vision}, tools={p.supports_tool_use})')

          # Test Grok reasoning detection
          grok_non = create_provider('grok', 'grok-4-1-fast-non-reasoning', 'k')
          assert not grok_non._is_reasoning_model(), 'grok-4-1-fast-non-reasoning should NOT be reasoning'

          grok_reason = create_provider('grok', 'grok-4-1-fast-reasoning', 'k')
          assert grok_reason._is_reasoning_model(), 'grok-4-1-fast-reasoning should be reasoning'

          grok_0709 = create_provider('grok', 'grok-4-0709', 'k')
          assert grok_0709._is_reasoning_model(), 'grok-4-0709 should be reasoning'
          assert grok_0709.supports_vision, 'grok-4-0709 should support vision'

          grok_code = create_provider('grok', 'grok-code-fast-1', 'k')
          assert not grok_code._is_reasoning_model(), 'grok-code-fast-1 should NOT be reasoning'

          grok_mini = create_provider('grok', 'grok-3-mini', 'k')
          assert grok_mini._is_reasoning_model(), 'grok-3-mini should be reasoning'

          # Grok 4.20 family
          grok_420_nr = create_provider('grok', 'grok-4.20-0309-non-reasoning', 'k')
          assert not grok_420_nr._is_reasoning_model(), 'grok-4.20-0309-non-reasoning should NOT be reasoning'
          assert grok_420_nr.supports_vision, 'grok-4.20-0309-non-reasoning should support vision'

          grok_420_r = create_provider('grok', 'grok-4.20-0309-reasoning', 'k')
          assert grok_420_r._is_reasoning_model(), 'grok-4.20-0309-reasoning should be reasoning'
          assert grok_420_r.supports_vision, 'grok-4.20-0309-reasoning should support vision'

          grok_420_ma = create_provider('grok', 'grok-4.20-multi-agent-0309', 'k')
          assert grok_420_ma.supports_vision, 'grok-4.20-multi-agent-0309 should support vision'

          # Test Kimi vision detection
          kimi_k25 = create_provider('kimi', 'kimi-k2.5', 'k')
          assert kimi_k25.supports_vision, 'kimi-k2.5 should support vision'
          assert kimi_k25.provider_name == 'kimi'

          kimi_k2 = create_provider('kimi', 'kimi-k2', 'k')
          assert not kimi_k2.supports_vision, 'kimi-k2 should NOT support vision'

          # Test moonshot alias
          kimi_alias = create_provider('moonshot', 'kimi-k2.5', 'k')
          assert kimi_alias.provider_name == 'kimi', 'moonshot alias should create KimiProvider'

          # Test MiniMax vision detection
          mm_m27 = create_provider('minimax', 'MiniMax-M2.7', 'k')
          assert not mm_m27.supports_vision, 'MiniMax-M2.7 should NOT support vision'
          assert mm_m27.provider_name == 'minimax'

          mm_m25 = create_provider('minimax', 'MiniMax-M2.5', 'k')
          assert mm_m25.supports_vision, 'MiniMax-M2.5 should support vision'

          mm_hs = create_provider('minimax', 'MiniMax-M2.7-highspeed', 'k')
          assert not mm_hs.supports_vision, 'MiniMax-M2.7-highspeed should NOT support vision'

          print('All provider tests passed')
          "
